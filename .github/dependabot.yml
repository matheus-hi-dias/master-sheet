    directory: '/apps/mobile'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'mobile'
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'

  # Pacotes compartilhados
  - package-ecosystem: 'npm'
    directory: '/packages/eslint-config'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'eslint-config'
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/packages/typescript-config'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'typescript-config'
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
