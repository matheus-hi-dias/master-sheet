      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
